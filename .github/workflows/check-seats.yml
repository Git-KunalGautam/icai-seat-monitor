name: Check ICAI seats

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch live batches without notifications or state changes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: icai-seat-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public batch availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED || 'true' }}
          NOTIFY_ON_SEAT_INCREASE: ${{ vars.NOTIFY_ON_SEAT_INCREASE || 'true' }}
          DEFAULT_REGION: ${{ vars.DEFAULT_REGION || 'Central' }}
          DEFAULT_POU: ${{ vars.DEFAULT_POU || 'JAIPUR' }}
          DEFAULT_COURSE: ${{ vars.DEFAULT_COURSE || 'Advanced (ICITSS) MCS Course' }}
          STATE_BACKEND: github
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi
